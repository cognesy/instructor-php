name: Documentation

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build and validate both documentation targets
        run: composer qa:docs-sites
        env:
          DOCS_SOURCE_SHA: ${{ github.sha }}

      - name: Upload Mintlify artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-mintlify-${{ github.sha }}
          path: builds/docs-build
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-pages-${{ github.sha }}
          path: builds/docs-site
          if-no-files-found: error
          retention-days: 7

  publish-mintlify:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - name: Download validated Mintlify artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-mintlify-${{ github.sha }}
          path: .artifacts/mintlify

      - name: Publish linear Mintlify deployment branch
        id: publish
        run: |
          set +e
          scripts/docs/publish-mintlify-branch.sh .artifacts/mintlify "${GITHUB_SHA}"
          status=$?
          set -e
          case "$status" in
            0)
              echo 'published=true' >> "$GITHUB_OUTPUT"
              ;;
            3)
              echo 'published=false' >> "$GITHUB_OUTPUT"
              echo "::warning::Mintlify publish skipped - origin/main advanced past ${GITHUB_SHA}. The newer commit's run owns this publish."
              ;;
            *)
              exit "$status"
              ;;
          esac

  deploy-pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      published: ${{ steps.freshness.outputs.current }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Detect superseded source commit
        id: freshness
        run: |
          git fetch origin main --depth=1
          if [ "$(git rev-parse origin/main)" = "${GITHUB_SHA}" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "::warning::Pages deploy skipped - origin/main advanced past ${GITHUB_SHA}. The newer commit's run owns this deploy."
          fi

      - name: Download validated Pages artifact
        if: steps.freshness.outputs.current == 'true'
        uses: actions/download-artifact@v8
        with:
          name: docs-pages-${{ github.sha }}
          path: .artifacts/pages

      - name: Configure GitHub Pages
        if: steps.freshness.outputs.current == 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages deployment artifact
        if: steps.freshness.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts/pages

      - name: Deploy GitHub Pages
        id: deployment
        if: steps.freshness.outputs.current == 'true'
        uses: actions/deploy-pages@v5

  verify-production:
    # Only meaningful when this run actually published. A superseded run publishes
    # nothing, so polling the live sites for its SHA would time out by design.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.publish-mintlify.outputs.published == 'true'
      && needs.deploy-pages.outputs.published == 'true'
    needs: [publish-mintlify, deploy-pages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify both public sites expose this source commit
        run: scripts/docs/verify-live-provenance.sh "${GITHUB_SHA}"
