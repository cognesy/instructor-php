name: Documentation

on:
  pull_request:
    paths:
      - '.github/workflows/docs.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'docs/**'
      - 'examples/**'
      - 'just/docs.just'
      - 'packages/*/CHEATSHEET.md'
      - 'packages/*/docs/**'
      - 'packages/doctools/**'
      - 'pyproject.toml'
      - 'scripts/docs/**'
      - 'uv.lock'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build and validate both documentation targets
        run: composer qa:docs-sites
        env:
          DOCS_SOURCE_SHA: ${{ github.sha }}

      - name: Upload Mintlify artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-mintlify-${{ github.sha }}
          path: builds/docs-build
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-pages-${{ github.sha }}
          path: builds/docs-site
          if-no-files-found: error
          retention-days: 7

  publish-mintlify:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download validated Mintlify artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-mintlify-${{ github.sha }}
          path: .artifacts/mintlify

      - name: Publish linear Mintlify deployment branch
        run: scripts/docs/publish-mintlify-branch.sh .artifacts/mintlify "${GITHUB_SHA}"

  deploy-pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Reject superseded source commit
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"

      - name: Download validated Pages artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-pages-${{ github.sha }}
          path: .artifacts/pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages deployment artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts/pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [publish-mintlify, deploy-pages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify both public sites expose this source commit
        run: scripts/docs/verify-live-provenance.sh "${GITHUB_SHA}"
