# Sources reviewed 2026-10-01:
# https://docs.perplexity.ai/docs/embeddings/quickstart.md
# https://docs.perplexity.ai/docs/embeddings/contextualized-embeddings.md
# Embeddings are returned as unnormalized base64 int8 values; compare them by
# cosine similarity. Matryoshka dimensions range from 128 to 1024.
# The driver sends all request inputs as the chunks of one document.
schemaVersion: 1
version: '2026-10-01'
profile:
  driver: perplexity
  model: pplx-embed-context-v1-0.6b
  maxInputs: 16000
  maxInputTokens: 32000
  defaultDimensions: 1024
  pricing:
    inputPerMToken: 0.008
